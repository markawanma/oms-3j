<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>บันทึกหลังไลฟ์</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.req{color:#B42318;font-weight:700}
.inp{display:block;width:100%;box-sizing:border-box;min-height:48px;padding:10px 12px;border:1px solid #D6CECE;border-radius:10px;font:inherit;font-size:16px;color:#2A2425;background:#fff}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #D6CECE;background:#fff;font-size:15px;font-weight:600;cursor:pointer}
.chip.on{background:#2A2425;border-color:#2A2425;color:#fff}
.night{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;height:56px;border-radius:12px;border:1px solid #D6CECE;background:#fff;font-size:12px;cursor:pointer}
.night b{font-size:16px}
.night.miss{border-color:#F3CFCB;background:#FFF6F5;color:#B42318}
.night.on{background:#2A2425;border-color:#2A2425;color:#fff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Noto Sans Thai', system-ui, sans-serif; color: #2A2425; background: #fff; display: flex; flex-direction: column">
  <header style="padding: 16px 16px 12px; border-bottom: 1px solid #ECE6E6">
    <div style="font-size: 13px; color: #5C5456">3J Insight · ลิงก์สำหรับคนไลฟ์</div>
    <h1 style="margin: 2px 0 10px; font-size: 22px; font-weight: 700">บันทึกหลังไลฟ์</h1>
    <div role="radiogroup" aria-label="เลือกคืน" style="display: flex; gap: 6px; overflow-x: auto">
      <button class="night miss" role="radio" aria-checked="false"><span>ส.</span><b>3</b></button>
      <button class="night miss" role="radio" aria-checked="false"><span>อา.</span><b>4</b></button>
      <button class="night" role="radio" aria-checked="false" style="color: #5C5456"><span>จ.</span><b>5</b></button>
      <button class="night on" role="radio" aria-checked="true"><span>อ.</span><b>6</b></button>
    </div>
    <div style="font-size: 13px; color: #B42318; font-weight: 600; margin-top: 8px">ยังไม่ได้บันทึก 2 คืน (ย้อนได้ 7 วัน)</div>
  </header>

  <form style="flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <div><label class="lbl" for="ll-s">เริ่ม <span class="req">*</span></label><input class="inp" id="ll-s" value="20:10"></div>
      <div><label class="lbl" for="ll-e">เลิก <span class="req">*</span></label><input class="inp" id="ll-e" value="22:45"></div>
      <div><label class="lbl" for="ll-p">คนดูสูงสุด <span class="req">*</span></label><input class="inp" id="ll-p" inputmode="numeric" value="210"></div>
    </div>
    <div>
      <span class="lbl">โฮสต์คืนนี้ <span class="req">*</span></span>
      <div role="radiogroup" aria-label="โฮสต์" style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" class="chip on" role="radio" aria-checked="true">โฮสต์ A</button>
        <button type="button" class="chip" role="radio" aria-checked="false">โฮสต์ B</button>
        <button type="button" class="chip" role="radio" aria-checked="false">+ เพิ่มชื่อ</button>
      </div>
    </div>
    <div>
      <label class="lbl" for="ll-q">คำถามที่ลูกค้าถามซ้ำ</label>
      <textarea class="inp" id="ll-q" rows="2" style="resize: none; line-height: 1.5">มีไซซ์ใหญ่กว่านี้ไหม</textarea>
      <div style="font-size: 13px; color: #5C5456; margin-top: 6px">1 บรรทัด = 1 คำถาม · จะเข้า Research เป็นสัญญาณให้อัตโนมัติ</div>
    </div>
    <div>
      <label class="lbl" for="ll-a">ของประมูล <span style="font-weight: 500; color: #5C5456">(ไม่บังคับ)</span></label>
      <input class="inp" id="ll-a" placeholder="เช่น กำไลเกลียว 2 วง">
    </div>
  </form>

  <div style="padding: 12px 16px 24px; border-top: 1px solid #ECE6E6">
    <button style="width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: #a2191d; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer">บันทึกคืน อ. 6 ต.ค.</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
