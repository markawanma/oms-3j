<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gem</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{w}}; height: {{w}}; filter: drop-shadow(0 6px 10px rgba(40, 10, 12, 0.22))">
<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true" style="display: block">
<polygon points="50,4 82,18 96,50 82,82 50,96 18,82 4,50 18,18" fill="{{dark}}"></polygon>
<polygon points="82,18 67,33 50,26" fill="{{color}}"></polygon>
<polygon points="96,50 74,50 67,33" fill="{{color}}"></polygon>
<polygon points="82,82 67,67 74,50" fill="{{color}}"></polygon>
<polygon points="50,96 50,74 67,67" fill="{{dark}}" opacity="0.7"></polygon>
<polygon points="18,82 33,67 50,74" fill="{{dark}}" opacity="0.7"></polygon>
<polygon points="4,50 26,50 33,67" fill="{{color}}"></polygon>
<polygon points="18,18 33,33 26,50" fill="{{color}}"></polygon>
<polygon points="50,4 50,26 33,33" fill="{{color}}"></polygon>
<polygon points="50,4 82,18 50,26" fill="{{light}}" opacity="0.9"></polygon>
<polygon points="82,18 96,50 67,33" fill="{{light}}" opacity="0.55"></polygon>
<polygon points="96,50 82,82 74,50" fill="{{light}}" opacity="0.35"></polygon>
<polygon points="82,82 50,96 67,67" fill="{{light}}" opacity="0.2"></polygon>
<polygon points="50,96 18,82 50,74" fill="{{light}}" opacity="0.25"></polygon>
<polygon points="18,82 4,50 33,67" fill="{{light}}" opacity="0.45"></polygon>
<polygon points="4,50 18,18 26,50" fill="{{light}}" opacity="0.8"></polygon>
<polygon points="18,18 50,4 33,33" fill="{{light}}"></polygon>
<polygon points="50,26 67,33 74,50 67,67 50,74 33,67 26,50 33,33" fill="{{color}}"></polygon>
<polygon points="50,26 74,50 50,74 26,50" fill="{{light}}" opacity="0.28"></polygon>
<polygon points="50,26 67,33 74,50 50,50" fill="{{dark}}" opacity="0.18"></polygon>
<polygon points="33,33 50,26 43,41" fill="#FFFFFF" opacity="0.6"></polygon>
<polygon points="22,22 34,14 28,26" fill="#FFFFFF" opacity="0.45"></polygon>
<polygon points="50,4 82,18 96,50 82,82 50,96 18,82 4,50 18,18" fill="none" stroke="{{dark}}" stroke-width="1"></polygon>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"color":{"editor":"color","default":"#A3192B"},"light":{"editor":"color","default":"#E0566A"},"dark":{"editor":"color","default":"#5C0A16"},"size":{"editor":"int","default":120,"min":16,"max":400},"$preview":{"width":120,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const size = Number(this.props.size) || 120;
    return {
      w: size + 'px',
      color: this.props.color ?? '#A3192B',
      light: this.props.light ?? '#E0566A',
      dark: this.props.dark ?? '#5C0A16'
    };
  }
}
</script>
</body>
</html>
