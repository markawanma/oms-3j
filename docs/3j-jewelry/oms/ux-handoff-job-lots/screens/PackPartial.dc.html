<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ส่ง partial เข้าสต็อก</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
.blk{background:#fff;border:1px solid #E8E2E2;border-radius:14px;padding:14px}
.lbl{display:block;font-size:17px;font-weight:700;margin:0 0 10px}
.step{display:flex;align-items:center;gap:10px}
.pm{width:56px;height:56px;border-radius:14px;border:1.5px solid #D6CECE;background:#fff;font-size:28px;font-weight:600;cursor:pointer;flex:none}
.num{flex:1;min-width:0;height:56px;border-radius:14px;border:1.5px solid #2A2425;text-align:center;font:inherit;font-size:28px;font-weight:700;box-sizing:border-box}
.seg{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; font-family: 'Noto Sans Thai', system-ui, sans-serif; color: #2A2425; background: #F6F3F3; display: flex; flex-direction: column; font-size: 18px">
  <header style="background: #fff; padding: 14px 16px; border-bottom: 1px solid #ECE6E6">
    <div style="font-size: 14px; color: #5C5456">ช่าง ง · QC · ส. 17 ต.ค.</div>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">JB-0020 · แหวนโกเมนไข่</h1>
    <div class="seg" aria-hidden="true" style="margin-top: 12px"><span style="flex: 34; background: #13613F"></span><span style="flex: 15; background: #E3A13B"></span><span style="flex: 50; background: #8FA9CF"></span><span style="flex: 1; background: #B42318"></span></div>
    <div style="display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 14px; color: #3A3335"><span>เสร็จ 34</span><span>QC 15</span><span>บ้านชุบ 50</span><span>เสีย 1</span><span style="color: #5C5456">/ 100</span></div>
  </header>
  <main style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <section class="blk" style="background: #EAF4EE; border-color: #BFE0CB">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 17px; font-weight: 700; color: #13613F">ผ่าน QC แล้ว รอเข้าสต็อก</span><strong style="font-size: 30px; color: #13613F">34</strong></div>
      <div style="font-size: 14px; color: #1F5C38">ส่วนที่ 3 · QC เสร็จ 10:30 (ผ่าน 34 · เสีย 1)</div>
    </section>
    <section class="blk">
      <label class="lbl" for="stock">ส่งเข้าสต็อกตอนนี้</label>
      <div class="step"><button class="pm" aria-label="ลด">−</button><input class="num" id="stock" inputmode="numeric" value="34"><button class="pm" aria-label="เพิ่ม">+</button></div>
      <div style="font-size: 14px; color: #5C5456; margin-top: 8px">ใส่ได้ไม่เกิน 34 · ส่งได้หลายรอบ</div>
    </section>
    <div style="padding: 12px 14px; border-radius: 12px; background: #F1EEEE; font-size: 15px; line-height: 1.6">เข้าสต็อกแล้วขายไลฟ์ได้ทันที · ที่เหลือ 66 ชิ้นเดินต่อ · ครบเมื่อไรระบบปิดใบให้เอง</div>
  </main>
  <div style="padding: 12px 16px 20px; background: #fff; border-top: 1px solid #ECE6E6">
    <button style="width: 100%; min-height: 60px; border: 0; border-radius: 14px; background: #13613F; color: #fff; font-size: 19px; font-weight: 700; cursor: pointer">ส่งเข้าสต็อก 34 ชิ้น</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
