<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>รับกลับจากบ้านชุบ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
.blk{background:#fff;border:1px solid #E8E2E2;border-radius:14px;padding:14px}
.lbl{display:block;font-size:17px;font-weight:700;margin:0 0 10px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border:1.5px solid #E1D9D9;border-radius:12px;cursor:pointer;font-size:17px;font-weight:600;box-sizing:border-box}
.opt.on{border-color:#2A2425;background:#FAF8F8 !important}
.r{width:22px;height:22px;border-radius:99px;border:2px solid #A99FA1;box-sizing:border-box;flex:none}
.opt.on .r{border:7px solid #2A2425}
.step{display:flex;align-items:center;gap:10px}
.pm{width:56px;height:56px;border-radius:14px;border:1.5px solid #D6CECE;background:#fff;font-size:28px;font-weight:600;cursor:pointer;flex:none}
.num{flex:1;min-width:0;height:56px;border-radius:14px;border:1.5px solid #2A2425;text-align:center;font:inherit;font-size:28px;font-weight:700;box-sizing:border-box}
</style>
</helmet>
<div style="width: 390px; min-height: 1000px; box-sizing: border-box; font-family: 'Noto Sans Thai', system-ui, sans-serif; color: #2A2425; background: #F6F3F3; display: flex; flex-direction: column; font-size: 18px">
  <header style="background: #fff; padding: 14px 16px; border-bottom: 1px solid #ECE6E6">
    <div style="font-size: 14px; color: #5C5456">ช่าง ง · QC · ศ. 16 ต.ค.</div>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">รับกลับจาก บ้านชุบ A</h1>
    <div style="font-size: 15px; color: #5C5456">JB-0020 · แหวนโกเมนไข่ · ไม่ต้องชั่งขั้นชุบ</div>
  </header>
  <main style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <section class="blk">
      <div class="lbl">ส่วนที่อยู่ที่บ้านชุบ</div>
      <div role="radiogroup" aria-label="เลือกส่วน" style="display: flex; flex-direction: column; gap: 8px">
        <button class="opt on" role="radio" aria-checked="true" style="background: #fff; text-align: left; width: 100%"><span class="r"></span><span style="flex: 1">ส่วนที่ 2 <span style="display: block; font-size: 14px; font-weight: 500; color: #5C5456">ออกไป 14 ต.ค. · 2 วัน</span></span><strong style="font-size: 22px">40</strong></button>
        <button class="opt" role="radio" aria-checked="false" style="background: #fff; text-align: left; width: 100%"><span class="r"></span><span style="flex: 1">ส่วนที่ 1 <span style="display: block; font-size: 14px; font-weight: 500; color: #5C5456">ออกไป 15 ต.ค. · 1 วัน</span></span><strong style="font-size: 22px">10</strong></button>
      </div>
    </section>
    <section class="blk">
      <label class="lbl" for="back">กลับมากี่ชิ้น (จาก 40)</label>
      <div class="step"><button class="pm" aria-label="ลด">−</button><input class="num" id="back" inputmode="numeric" value="35"><button class="pm" aria-label="เพิ่ม">+</button></div>
    </section>
    <section class="blk" style="border-color: #F0D49A">
      <div class="lbl">ที่เหลือ 5 ชิ้น อยู่ไหน?</div>
      <div role="radiogroup" aria-label="ที่เหลือ" style="display: flex; flex-direction: column; gap: 8px">
        <button class="opt on" role="radio" aria-checked="true" style="background: #fff; text-align: left; width: 100%"><span class="r"></span>ยังอยู่ที่บ้านชุบ (กลับรอบหน้า)</button>
        <button class="opt" role="radio" aria-checked="false" style="background: #fff; text-align: left; width: 100%"><span class="r"></span>เสียที่ผู้รับจ้าง</button>
        <button class="opt" role="radio" aria-checked="false" style="background: #fff; text-align: left; width: 100%"><span class="r"></span>หายที่ผู้รับจ้าง</button>
      </div>
      <div style="font-size: 14px; color: #5C5456; margin-top: 8px">เลือกเสีย/หาย ต้องใส่เหตุผล</div>
    </section>
    <div style="padding: 12px 14px; border-radius: 12px; background: #F1EEEE; font-size: 15px; line-height: 1.6">35 ชิ้นจะมาอยู่กับคุณที่ <strong>QC</strong> (แยกเป็นส่วนที่ 3)<br>ส่วนที่ 2 เหลือ 5 ชิ้นที่บ้านชุบ A</div>
  </main>
  <div style="padding: 12px 16px 20px; background: #fff; border-top: 1px solid #ECE6E6">
    <button style="width: 100%; min-height: 60px; border: 0; border-radius: 14px; background: #a2191d; color: #fff; font-size: 19px; font-weight: 700; cursor: pointer">รับกลับ 35 ชิ้น</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
